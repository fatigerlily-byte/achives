<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f1">
  <title>アーカイブサイト</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f5f1;
      --ink: #252722;
      --muted: #77796f;
      --line: #d9d8d0;
      --accent: #55624f;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    .page { width: min(1440px, 100% - 80px); margin: 0 auto; }
    header { padding: 48px 0 35px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 14px; color: var(--accent); font-size: .76rem; letter-spacing: .18em; }
    h1 { margin: 0; font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif; font-size: clamp(2rem, 4vw, 3.5rem); font-weight: 500; letter-spacing: .06em; }
    .question { display: flex; gap: 18px; align-items: baseline; margin: 24px 0 0; font-size: .88rem; }
    .question strong { color: var(--muted); font-weight: 500; letter-spacing: .05em; }
    main { padding: 30px 0 76px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
    .section-head h2 { margin: 0; font-size: .92rem; font-weight: 500; letter-spacing: .08em; }
    .count { color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
    .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-flow: row; align-items: start; column-gap: 18px; row-gap: 62px; }
    .card { min-width: 0; }
    .card:nth-child(1) { grid-column: 1 / span 7; margin-top: 4px; }
    .card:nth-child(2) { grid-column: 9 / span 4; margin-top: 92px; }
    .card:nth-child(3) { grid-column: 3 / span 5; margin-top: -8px; }
    .card:nth-child(4) { grid-column: 9 / span 4; margin-top: 44px; }
    .card:nth-child(5) { grid-column: 2 / span 6; margin-top: 14px; }
    .photo-button { display: block; width: 100%; padding: 0; border: 0; background: #e8e7e0; cursor: zoom-in; overflow: hidden; }
    .photo-button img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; transition: transform .35s ease; }
    .photo-button:hover img, .photo-button:focus-visible img { transform: scale(1.015); }
    .photo-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .caption { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-top: 12px; }
    .name { margin: 0; font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif; font-size: 1.08rem; font-weight: 500; letter-spacing: .04em; }
    .words { margin: 0; color: var(--muted); font-size: .86rem; }
    footer { padding: 18px 0 28px; border-top: 1px solid var(--line); color: var(--muted); font-size: .74rem; letter-spacing: .06em; }
    dialog { width: min(96vw, 1500px); max-width: none; max-height: 94vh; padding: 0; border: 0; background: transparent; overflow: visible; }
    dialog::backdrop { background: rgb(20 21 18 / 88%); }
    dialog img { display: block; width: 100%; max-height: 90vh; object-fit: contain; }
    .close { position: fixed; top: 18px; right: 22px; border: 1px solid rgb(255 255 255 / 55%); border-radius: 50%; width: 42px; height: 42px; color: white; background: rgb(0 0 0 / 30%); font-size: 1.4rem; cursor: pointer; }
    @media (max-width: 760px) {
      .page { width: calc(100% - 36px); }
      header { padding: 34px 0 26px; }
      .question { gap: 10px; margin-top: 18px; font-size: .8rem; }
      main { padding: 24px 0 48px; }
      .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); column-gap: 12px; row-gap: 36px; }
      .card:nth-child(1) { grid-column: 1 / span 5; margin-top: 0; }
      .card:nth-child(2) { grid-column: 3 / span 4; margin-top: 0; }
      .card:nth-child(3) { grid-column: 1 / span 4; margin-top: 0; }
      .card:nth-child(4) { grid-column: 3 / span 4; margin-top: 0; }
      .card:nth-child(5) { grid-column: 2 / span 5; margin-top: 0; }
      .caption { padding-top: 10px; }
      .name { font-size: 1rem; }
      footer { padding-bottom: 22px; }
    }
    @media (max-width: 440px) {
      .grid { grid-template-columns: 1fr; row-gap: 30px; }
      .card:nth-child(n) { grid-column: 1; }
      .card:nth-child(2), .card:nth-child(4) { width: 88%; justify-self: end; }
      .card:nth-child(3) { width: 90%; }
      .card:nth-child(5) { width: 94%; justify-self: center; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <p class="eyebrow">PERSONAL ARCHIVE</p>
      <h1>アーカイブサイト</h1>
      <p class="question"><strong>いま気になっていること</strong><span>小さいペットボトルのキャップは開けにくく、こぼしやすいのではないだろうか？</span></p>
    </header>
    <main>
      <div class="section-head">
        <h2>写真</h2>
        <span class="count">05 items</span>
      </div>
      <section class="grid" aria-label="写真の一覧">
        <article class="card">
          <button class="photo-button" type="button" aria-label="01.jpg を拡大表示"><img src="images/01.jpg" alt="地面に散らばる割れた鏡" loading="lazy"></button>
          <div class="caption"><h3 class="name">01</h3><p class="words">多鏡面</p></div>
        </article>
        <article class="card">
          <button class="photo-button" type="button" aria-label="02.jpg を拡大表示"><img src="images/02.jpg" alt="山並みに沈む夕日" loading="lazy"></button>
          <div class="caption"><h3 class="name">02</h3><p class="words">夕暮れ</p></div>
        </article>
        <article class="card">
          <button class="photo-button" type="button" aria-label="03.jpg を拡大表示"><img src="images/03.jpg" alt="光が重なる葉の抽象的な写真" loading="lazy"></button>
          <div class="caption"><h3 class="name">03</h3><p class="words">揺れ残る</p></div>
        </article>
        <article class="card">
          <button class="photo-button" type="button" aria-label="04.jpg を拡大表示"><img src="images/04.jpg" alt="葉の間から見える看板" loading="lazy"></button>
          <div class="caption"><h3 class="name">04</h3><p class="words">トマソン</p></div>
        </article>
        <article class="card">
          <button class="photo-button" type="button" aria-label="05.jpg を拡大表示"><img src="images/05.jpg" alt="風に舞う枯れ葉" loading="lazy"></button>
          <div class="caption"><h3 class="name">05</h3><p class="words">浮遊</p></div>
        </article>
      </section>
    </main>
    <footer>ARCHIVE · 05</footer>
  </div>
  <dialog id="viewer" aria-label="写真の拡大表示">
    <button class="close" type="button" aria-label="閉じる">×</button>
    <img alt="">
  </dialog>
  <script>
    const viewer = document.querySelector('#viewer');
    const viewerImage = viewer.querySelector('img');
    document.querySelectorAll('.photo-button').forEach((button) => {
      button.addEventListener('click', () => {
        const image = button.querySelector('img');
        viewerImage.src = image.src;
        viewerImage.alt = image.alt;
        viewer.showModal();
      });
    });
    viewer.querySelector('.close').addEventListener('click', () => viewer.close());
    viewer.addEventListener('click', (event) => {
      if (event.target === viewer) viewer.close();
    });
  </script>
</body>
</html>
